name: "🐛 Bug Report"
description: "File a structured bug report to help us improve RIP Social"
title: "[BUG]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! 
        Please verify that you are running the latest version from `main` before submitting.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the monorepo does this issue affect?
      options:
        - "apps/web (Next.js Frontend)"
        - "apps/api (Hono Backend)"
        - "packages/db (Drizzle Database)"
        - "packages/config (Tooling / Configs)"
        - "CI/CD & DevOps"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When submitting an issue with location data, the API returns..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Run `docker compose up -d`
        2. Run `bun dev`
        3. Navigate to '...'
        4. Observe error: '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: "The issue should be created and assigned a local ward tag."
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS, Node/Bun version, Browser (if applicable).
      placeholder: "Ubuntu 24.04 / macOS Sonoma, Bun 1.1.42, Chrome 130"
    validations:
      required: true
